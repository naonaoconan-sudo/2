<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#073b78"><link rel="manifest" href="./manifest.json"><title>近鉄 鉄道運転シミュレーション</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091321;color:white;font-family:system-ui,Meiryo,sans-serif}header{height:34px;background:#073b78;padding:5px 12px;font-weight:900;display:flex;justify-content:space-between}main{height:calc(100% - 34px);padding:7px;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:minmax(0,1fr) auto;gap:7px}canvas{width:100%;height:100%;border:2px solid #506985;border-radius:9px}.side{display:grid;grid-template-rows:auto auto 1fr;gap:7px;min-height:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.panel{background:#1b2b42;border:1px solid #48617e;border-radius:9px;padding:7px}.label{font-size:11px;color:#c2d1e3}.value{font-size:clamp(20px,3vw,32px);font-weight:900;color:#62d6ff}.cab{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lever{background:#111d2d;border:1px solid #526b88;border-radius:9px;padding:7px;display:flex;flex-direction:column;justify-content:space-between}.title{text-align:center;font-weight:900}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.keys button{padding:7px 1px;border:0;border-radius:6px;background:#344b68;color:white;font-weight:900}.keys button.active{background:#0874d8;outline:2px solid #9bdcff}.keys button.br.active{background:#c33}.read{text-align:center;color:#ffe08b;font-weight:900;margin-top:4px}#msg{font-size:12px;color:#ffe08b;min-height:26px}.footer{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:11px}.footer button{padding:8px 14px;border:0;border-radius:7px;background:#425a78;color:white;font-weight:bold}#portrait{display:none}
@media(orientation:portrait){#portrait{display:flex;position:fixed;z-index:9;inset:0;background:#071321;align-items:center;justify-content:center;text-align:center;padding:25px}main{visibility:hidden}}
@media(max-height:440px){header{height:27px;font-size:13px}main{height:calc(100% - 27px);padding:4px;gap:4px}.panel{padding:4px}.label{font-size:9px}.value{font-size:20px}.keys button{padding:4px 1px;font-size:11px}.title{font-size:12px}}
</style></head><body>
<div id="portrait"><div><div style="font-size:48px">📱 ↻</div><h2>スマホを横向きにしてね</h2><p>横向きで運転台が表示されます。</p><button onclick="lockLandscape()" style="padding:10px 18px;background:#1264c5;color:white;border:0;border-radius:8px">横向きで開始</button></div></div>
<header><span>🚃 近鉄 鉄道運転シミュレーション</span><span>名古屋線・普通</span></header><main>
<canvas id="view"></canvas><section class="side">
<div class="stats"><div class="panel"><div class="label">速度</div><div class="value"><span id="speed">0</span> km/h</div></div><div class="panel"><div class="label">次の駅</div><div class="value" id="next">桑名</div><div class="label">残り <b id="dist">1.20 km</b></div></div><div class="panel"><div class="label">制限速度</div><div class="value">70 km/h</div></div><div class="panel"><div class="label">状態</div><div class="value" id="state" style="font-size:20px">停車中</div></div></div>
<div class="panel"><div id="msg">マスコンをP1以上にして出発！</div><div class="label">駅までの距離</div><div style="height:7px;background:#34465f;border-radius:8px;overflow:hidden"><div id="bar" style="height:100%;width:0;background:#45d879"></div></div></div>
<div class="cab"><div class="lever"><div class="title">マスコン</div><div class="keys" id="powers"><button data-v="P5">P5</button><button data-v="P4">P4</button><button data-v="P3">P3</button><button data-v="P2">P2</button><button data-v="P1">P1</button><button data-v="切" class="active">切</button></div><div class="read" id="pRead">切</div></div><div class="lever"><div class="title">ブレーキ</div><div class="keys" id="brakes"><button class="br" data-v="B5">B5</button><button class="br" data-v="B4">B4</button><button class="br" data-v="B3">B3</button><button class="br" data-v="B2">B2</button><button class="br" data-v="B1">B1</button><button class="br" data-v="非常">非常</button></div><div class="read" id="bRead">緩解</div></div></div></section>
<div class="footer"><span>ATS：<b id="ats" style="color:#54e77a">正常</b>　↑/↓キーでも操作可能</span><button id="reset">↻ リセット</button></div></main>
<script>
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
async function lockLandscape(){try{await screen.orientation.lock('landscape')}catch(e){}}
let cv=document.querySelector('#view'),c=cv.getContext('2d'),speed=0,dist=1.2,st=0,p=0,b=0,halt=true,offset=0,last=0;let names=['桑名','近鉄四日市','津','伊勢中川'];
const $=x=>document.getElementById(x);function size(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}new ResizeObserver(size).observe(cv);size();
function draw(){
 let w=cv.clientWidth,h=cv.clientHeight;c.clearRect(0,0,w,h);
 // distant sky and horizon
 let sky=c.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#72b9ee');sky.addColorStop(.55,'#d7edfa');sky.addColorStop(.72,'#a7c1b4');sky.addColorStop(1,'#59665e');c.fillStyle=sky;c.fillRect(0,0,w,h);
 // distant hills, kept clear of the track corridor
 c.fillStyle='#829e91';c.beginPath();c.moveTo(0,h*.57);for(let x=0;x<=w;x+=w/8)c.lineTo(x,h*(.48+Math.sin(x*.013)*.035));c.lineTo(w,h*.68);c.lineTo(0,h*.68);c.fill();
 // low distant town at the far sides only
 for(let i=0;i<22;i++){let side=i%2,depth=Math.floor(i/2),x=side?w*.68+depth*35:w*.02+depth*34;let bh=10+(i*17)%30;c.fillStyle=['#c2c8c4','#aab9b6','#d2c9ba'][i%3];c.fillRect(x,h*.61-bh,22,bh);c.fillStyle='#e7eee9';c.fillRect(x+5,h*.61-bh+5,5,5)}
 // trackside grass and shrubs
 c.fillStyle='#557c55';c.beginPath();c.moveTo(0,h*.68);c.lineTo(w*.39,h*.68);c.lineTo(w*.12,h);c.lineTo(0,h);c.fill();c.beginPath();c.moveTo(w,h*.68);c.lineTo(w*.61,h*.68);c.lineTo(w*.88,h);c.lineTo(w,h);c.fill();
 for(let i=0;i<32;i++){let t=((i/32+offset*.00045)%1),y=h*(.58+t*.42),s=.4+t*1.8;let left=w*(.40-t*.29),right=w*(.60+t*.29);c.fillStyle=i%2?'#315e3d':'#477447';c.beginPath();c.arc(left-8*t,y,3*s,0,Math.PI*2);c.arc(right+8*t,y,3*s,0,Math.PI*2);c.fill()}
 // ballast bed and sleepers: converge to a clear vanishing point
 c.fillStyle='#555d64';c.beginPath();c.moveTo(w*.485,h*.60);c.lineTo(w*.515,h*.60);c.lineTo(w*.91,h);c.lineTo(w*.09,h);c.closePath();c.fill();
 // sleepers first, then rails
 for(let i=0;i<23;i++){let t=((i/23+offset*.0012)%1),y=h*(.60+t*.40),half=w*(.015+t*.20);c.strokeStyle='#30383c';c.lineWidth=1+t*4;c.beginPath();c.moveTo(w/2-half,y);c.lineTo(w/2+half,y);c.stroke()}
 c.strokeStyle='#c8d0d4';c.lineWidth=2.5;c.beginPath();c.moveTo(w*.493,h*.60);c.lineTo(w*.16,h);c.moveTo(w*.507,h*.60);c.lineTo(w*.84,h);c.stroke();
 // catenary masts stay beside the track, never in front of the vanishing point
 for(let i=0;i<7;i++){let t=((i/7+offset*.00065)%1),y=h*(.40+t*.60),half=w*(.025+t*.24),x1=w/2-half*.88,x2=w/2+half*.88,top=y-h*(.22+t*.02);c.strokeStyle='#52636b';c.lineWidth=1+t*2;c.beginPath();c.moveTo(x1,top);c.lineTo(x1,y);c.moveTo(x2,top);c.lineTo(x2,y);c.moveTo(x1,top+5+t*8);c.lineTo(x2,top+5+t*8);c.stroke()}
 // overhead wires run toward horizon
 c.strokeStyle='#3d4b54';c.lineWidth=1.5;c.beginPath();c.moveTo(w*.46,0);c.lineTo(w*.495,h*.60);c.moveTo(w*.54,0);c.lineTo(w*.505,h*.60);c.stroke();
 // front cab frame
 c.fillStyle='#101b2b';c.fillRect(0,h*.88,w,h*.12);c.fillStyle='#26394f';c.fillRect(w*.04,h*.91,w*.92,h*.06);c.fillStyle='#21df70';c.font='bold 14px sans-serif';c.fillText('ATS',w*.47,h*.95);
}function render(){$('speed').textContent=Math.round(speed);$('dist').textContent=dist.toFixed(2)+' km';$('next').textContent=names[st];$('state').textContent=halt?'停車中':b?'ブレーキ':p?'力行':'惰行';$('bar').style.width=((1.2-dist)/1.2*100)+'%';$('pRead').textContent=p?'P'+p:'切';$('bRead').textContent=b===6?'非常':b?'B'+b:'緩解'}
function choose(v){if(v[0]==='P'){p=+v[1];b=0;halt=false;$('msg').textContent=v+'：加速中'}else if(v==='切'){p=0;b=0;halt=false;$('msg').textContent='惰行中'}else{p=0;b=v==='非常'?6:+v[1];halt=false;$('msg').textContent=v==='非常'?'非常ブレーキ！':'ブレーキ '+v}document.querySelectorAll('.keys button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render()}
document.querySelectorAll('.keys button').forEach(x=>x.onclick=()=>choose(x.dataset.v));
$('reset').onclick=()=>{speed=0;dist=1.2;st=0;p=0;b=0;halt=true;$('msg').textContent='マスコンをP1以上にして出発！';document.querySelectorAll('.keys button').forEach(x=>x.classList.toggle('active',x.dataset.v==='切'));render()};
onkeydown=e=>{if(e.key==='ArrowUp')choose('P5');if(e.key==='ArrowDown')choose('B3')};
function loop(t){let dt=Math.min((t-last)/1000||0,.05);last=t;if(!halt){if(p)speed=Math.min(70,speed+(3+p*2.4)*dt);else if(b)speed=Math.max(0,speed-(b===6?35:b*4.2)*dt);else speed=Math.max(0,speed-.7*dt);dist=Math.max(0,dist-speed*dt/3600);offset+=speed*dt*2.4;if(speed>=70)$('ats').textContent='速度注意';else $('ats').textContent='正常';if(dist===0&&speed<=2){speed=0;halt=true;p=0;b=0;$('msg').textContent=names[st]+'駅に停車！次の駅へ';st=(st+1)%names.length;dist=1.2;document.querySelectorAll('.keys button').forEach(x=>x.classList.toggle('active',x.dataset.v==='切'))}else if(dist===0)$('msg').textContent='駅を通過！ブレーキをかけてください';render()}draw();requestAnimationFrame(loop)}render();requestAnimationFrame(loop);
</script></body></html>
